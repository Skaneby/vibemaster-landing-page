<!DOCTYPE html>
<!--
  Source for assets/images/og-image.png (1200x630 social preview).
  Render with: node scripts/og-image/render.mjs

  Safe zone: Threads, WhatsApp and some other apps crop the preview to a
  centred square. Everything important stays inside the middle ~630px
  (dashed guide visible with ?guide). The side areas are decoration only.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet"/>
<style>
  :root {
    --ivory: #FAFAEB; --bone: #F5F5E6; --sand: #EBEBD5; --mist: #B8BCA3;
    --ink: #1E2113; --moss: #5A5E45; --olive: #6B7A2F; --bronze: #B08F4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(520px 380px at 50% 45%, #FDFCF0 0%, rgba(253,252,240,0) 70%),
      var(--ivory);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--ink);
    position: relative;
  }
  /* faint dot grid on the sides, fades out towards the centre */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(var(--mist) 1.2px, transparent 1.3px);
    background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 32%, transparent 68%, #000 100%);
    mask-image: linear-gradient(90deg, #000 0%, transparent 32%, transparent 68%, #000 100%);
    opacity: .55;
  }
  .safe {
    position: absolute; top: 0; bottom: 0; left: 285px; width: 630px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .guide .safe { outline: 2px dashed #B4412A; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
  .mark {
    width: 44px; height: 44px; border-radius: 10px; background: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .brand span { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }

  h1 {
    font-size: 60px; line-height: 1.04; font-weight: 800; letter-spacing: -0.04em;
  }
  h1 em { font-style: normal; color: var(--bronze); }

  .flow { display: flex; align-items: center; margin-top: 38px; }
  .node {
    font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 10px;
    background: var(--bone); border: 1.5px solid var(--mist); color: var(--moss);
    white-space: nowrap;
  }
  .node.mid { background: #EEF0D8; border-color: var(--olive); color: var(--olive); }
  .node.end { background: var(--ink); border-color: var(--ink); color: var(--ivory); }
  .arrow { width: 34px; height: 14px; flex: none; }
</style>
</head>
<body>
  <div class="safe">
    <div class="brand">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FAFAEB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 6l4 8 6-12"/></svg>
      </div>
      <span>Vibemaster</span>
    </div>

    <h1>You bring the idea.<br/>We make it<br/><em>buildable.</em></h1>

    <div class="flow">
      <div class="node">Idea</div>
      <svg class="arrow" viewBox="0 0 34 14"><path d="M3 7h24" stroke="#6B7A2F" stroke-width="2"/><path d="M25 2l6 5-6 5z" fill="#6B7A2F"/></svg>
      <div class="node mid">Spec</div>
      <svg class="arrow" viewBox="0 0 34 14"><path d="M3 7h24" stroke="#6B7A2F" stroke-width="2"/><path d="M25 2l6 5-6 5z" fill="#6B7A2F"/></svg>
      <div class="node mid">Build prompt</div>
      <svg class="arrow" viewBox="0 0 34 14"><path d="M3 7h24" stroke="#6B7A2F" stroke-width="2"/><path d="M25 2l6 5-6 5z" fill="#6B7A2F"/></svg>
      <div class="node end">AI builds</div>
    </div>
  </div>
  <script>if (location.search.includes('guide')) document.body.classList.add('guide');</script>
</body>
</html>
